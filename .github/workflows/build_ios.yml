name: Build iOS IPA (Automated Cloud Build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile iOS App & Package IPA
    runs-on: macos-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: 3. Install App Dependencies
        run: |
          flutter pub get

      - name: 4. Build iOS App (Release - No Codesign)
        run: |
          flutter build ios --release --no-codesign

      - name: 5. Package into .ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../esp32_nav_app.ipa Payload
          cd ../../..

      - name: 6. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-nav-app-ios-ipa
          path: esp32_nav_app.ipa
          retention-days: 14
